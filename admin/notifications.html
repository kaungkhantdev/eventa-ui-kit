<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventa · Notifications</title>
<script>try{var t=localStorage.getItem('eventa-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script src="../assets/config.js?v=68"></script>
<link rel="stylesheet" href="../assets/app.css?v=68" />
</head>
<body class="h-full bg-canvas font-sans text-ink antialiased" data-page="notifications">

<div class="flex h-full min-h-screen" data-layout>
  <!-- shell.js injects #backdrop + #sidebar here -->

  <main class="min-w-0 flex-1 overflow-y-auto px-5 py-4 lg:px-7">

    <!-- header -->
    <div class="mb-4 flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3">
        <button id="btn-menu" class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-surface text-muted hover:text-ink lg:hidden" title="Open menu"><i class="hgi-stroke hgi-menu-01 text-[18px]"></i></button>
        <div class="min-w-0">
          <h1 class="text-[22px] font-bold tracking-tight">Notifications</h1>
          <p class="mt-0.5 hidden truncate text-[12px] text-muted sm:block">Registrations, payments, feedback and things that need your attention.</p>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-2.5"><button id="mark-all" type="button" class="btn btn-ghost shrink-0"><i class="hgi-stroke hgi-tick-double-01 text-[16px]"></i><span class="hidden sm:inline">Mark all read</span><span class="sm:hidden">Read</span></button><button type="button" class="relative grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-surface text-muted transition hover:text-ink" title="Notifications"><i class="hgi-stroke hgi-notification-03 text-[18px]"></i><span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-red-500 ring-2 ring-surface"></span></button><div class="flex shrink-0 items-center gap-2.5"><div class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-brand to-emerald-400 text-[12px] font-semibold text-white">HN</div><div class="hidden leading-tight sm:block"><p class="text-[13px] font-semibold text-ink">Harper Nelson</p><p class="text-[11px] text-muted">Event Manager</p></div></div></div>
    </div>

    <!-- filter -->
    <div class="flex w-fit max-w-full items-center gap-1 overflow-x-auto rounded-xl bg-surface p-1">
      <button class="pilltab tab-active" data-filter="all">All<span class="pilltab-count" id="count-all">0</span></button>
      <button class="pilltab" data-filter="unread">Unread<span class="pilltab-count" id="count-unread">0</span></button>
    </div>

    <div id="feed" class="mt-4 space-y-4 rounded-2xl bg-surface p-2 sm:p-3"></div>
    <p id="feed-empty" class="hidden py-10 text-center text-[13px] text-muted">You're all caught up — no unread notifications.</p>
    <!-- JIT safelist for JS-inserted feed-row classes -->
    <div class="hidden hover:bg-line bg-brand-soft/50 space-y-0.5"></div>

    <p class="mt-6 text-center text-[11px] text-muted/70">Eventa · Event registration system · HTML, Tailwind CSS &amp; Hugeicons</p>
  </main>
</div>

<script src="../assets/shell.js?v=68"></script>
<script>
(function () {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* Icon tints per notification kind */
  var TINT = {
    registration: 'bg-brand-soft text-brand',
    payment:      'bg-blue-50 text-blue-500 dark:bg-blue-500/15 dark:text-blue-300',
    sales:        'bg-amber-50 text-amber-500 dark:bg-amber-400/15 dark:text-amber-300',
    feedback:     'bg-violet-50 text-violet-500 dark:bg-violet-500/15 dark:text-violet-300',
    payout:       'bg-brand-soft text-brand',
    alert:        'bg-red-50 text-red-500 dark:bg-red-500/15 dark:text-red-300',
    task:         'bg-gray-100 text-gray-500 dark:bg-white/10 dark:text-gray-300'
  };

  /* group -> list of notifications (newest first). recent groups show by default; older reveal via "Show older". */
  var GROUPS = [
    { label: 'Today', recent: true, items: [
      { kind: 'registration', icon: 'hgi-user-add-01',      title: 'New registration',        body: 'Anong Pattana joined <b class="font-semibold text-ink">Tech Summit 2026</b>',            time: '2 min ago',  unread: true },
      { kind: 'payment',      icon: 'hgi-wallet-01',         title: 'Payment received',        body: '฿1,250 from Ploy Srisai',                                                                time: '18 min ago', unread: true },
      { kind: 'sales',        icon: 'hgi-ticket-01',         title: 'Almost sold out',         body: 'VIP Access is <b class="font-semibold text-ink">92% sold</b> for Tech Summit 2026',      time: '1 hr ago',   unread: true },
      { kind: 'task',         icon: 'hgi-note-edit',         title: 'Registration form needs approval', body: '3 pending registrations for Tech Summit 2026',                                 time: '2 hr ago',   unread: false },
      { kind: 'alert',        icon: 'hgi-alert-circle',      title: 'Payment declined',        body: "Mia Thompson's payment was declined for Bangkok Jazz Night",                             time: '3 hr ago',   unread: false }
    ]},
    { label: 'Yesterday', recent: true, items: [
      { kind: 'feedback',     icon: 'hgi-star',              title: 'New feedback',            body: 'Bangkok Jazz Night rated <b class="font-semibold text-ink">4.8★</b>',                     time: 'Yesterday',  unread: false },
      { kind: 'alert',        icon: 'hgi-alert-02',          title: 'Speaker not confirmed',   body: 'Sunrise Yoga Retreat still has 1 unconfirmed speaker',                                   time: 'Yesterday',  unread: false },
      { kind: 'task',         icon: 'hgi-message-question',  title: 'Vendor reply pending',    body: 'Awaiting catering quote for Tech Summit 2026',                                           time: 'Yesterday',  unread: false }
    ]},
    { label: 'Earlier this week', recent: true, items: [
      { kind: 'payout',       icon: 'hgi-dollar-circle',     title: 'Payout completed',        body: '฿48,290 was sent to your bank account',                                                  time: 'Jul 15',     unread: false },
      { kind: 'registration', icon: 'hgi-user-add-01',       title: '24 new registrations',    body: 'This week for <b class="font-semibold text-ink">Thai Street Food Festival</b>',           time: 'Jul 14',     unread: false }
    ]},
    { label: 'Last week', recent: false, items: [
      { kind: 'payout',       icon: 'hgi-dollar-circle',     title: 'Payout completed',        body: '฿32,100 was sent to your bank account',                                                  time: 'Jul 11',     unread: false },
      { kind: 'registration', icon: 'hgi-user-add-01',       title: '18 new registrations',    body: 'For <b class="font-semibold text-ink">Bangkok Jazz Night</b>',                           time: 'Jul 10',     unread: false },
      { kind: 'feedback',     icon: 'hgi-star',              title: 'New feedback',            body: 'UX Bangkok Meetup rated <b class="font-semibold text-ink">4.7★</b>',                      time: 'Jul 9',      unread: false },
      { kind: 'alert',        icon: 'hgi-alert-circle',      title: 'Low ticket inventory',    body: 'Only 8 VIP tickets left for Thai Street Food Festival',                                   time: 'Jul 8',      unread: false }
    ]}
  ];

  function itemHTML(n) {
    var tint = TINT[n.kind] || TINT.task;
    return '<div class="flex items-start gap-3 rounded-xl px-3 py-3 transition hover:bg-line' + (n.unread ? ' bg-brand-soft/50' : '') + '" data-unread="' + (n.unread ? '1' : '0') + '">' +
      '<span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl ' + tint + '"><i class="hgi-stroke ' + n.icon + ' text-[18px]"></i></span>' +
      '<div class="min-w-0 flex-1">' +
        '<div class="flex items-center gap-2"><p class="text-[13px] font-semibold text-ink">' + esc(n.title) + '</p>' + (n.unread ? '<span class="h-1.5 w-1.5 shrink-0 rounded-full bg-brand"></span>' : '') + '</div>' +
        '<p class="mt-0.5 text-[12px] leading-snug text-muted">' + n.body + '</p>' +
      '</div>' +
      '<span class="shrink-0 whitespace-nowrap text-[11px] text-muted tnum">' + esc(n.time) + '</span>' +
    '</div>';
  }

  var feed = document.getElementById('feed');
  var elEmpty = document.getElementById('feed-empty');
  var cAll = document.getElementById('count-all');
  var cUnread = document.getElementById('count-unread');
  var filter = 'all';
  var showOlder = false;

  function counts() {
    var all = 0, unread = 0;
    GROUPS.forEach(function (g) { g.items.forEach(function (n) { all++; if (n.unread) unread++; }); });
    return { all: all, unread: unread };
  }
  function hasOlder() {
    return GROUPS.some(function (g) { return !g.recent && g.items.some(function (n) { return filter === 'all' || n.unread; }); });
  }

  function render() {
    var html = '';
    GROUPS.forEach(function (g) {
      if (!g.recent && !showOlder) return;
      var items = g.items.filter(function (n) { return filter === 'all' || n.unread; });
      if (!items.length) return;
      html += '<section><h2 class="mb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-muted">' + esc(g.label) + '</h2>' +
              '<div class="space-y-0.5">' + items.map(itemHTML).join('') + '</div></section>';
    });
    if (!showOlder && hasOlder()) {
      html += '<div class="px-1 pt-1 text-center"><button id="show-older" type="button" class="btn btn-soft btn-sm"><i class="hgi-stroke hgi-arrow-down-01 text-[14px]"></i>Show older activity</button></div>';
    }
    feed.innerHTML = html;
    feed.classList.toggle('hidden', html === '');
    var c = counts();
    cAll.textContent = c.all;
    cUnread.textContent = c.unread;
    elEmpty.classList.toggle('hidden', !(filter === 'unread' && c.unread === 0));
  }

  feed.addEventListener('click', function (e) {
    if (e.target.closest('#show-older')) { showOlder = true; render(); }
  });

  document.querySelectorAll('[data-filter]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-filter]').forEach(function (b) { b.classList.remove('tab-active'); });
      btn.classList.add('tab-active');
      filter = btn.dataset.filter; showOlder = false;
      render();
    });
  });

  document.getElementById('mark-all').addEventListener('click', function () {
    GROUPS.forEach(function (g) { g.items.forEach(function (n) { n.unread = false; }); });
    render();
  });

  render();
})();
</script>
</body>
</html>

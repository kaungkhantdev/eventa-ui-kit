<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventa · Organization</title>
<script>try{var t=localStorage.getItem('eventa-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script src="../assets/config.js?v=68"></script>
<link rel="stylesheet" href="../assets/app.css?v=68" />
</head>
<body class="h-full bg-canvas font-sans text-ink antialiased" data-page="settings-organization">

<div class="flex h-full min-h-screen" data-layout>
  <!-- shell.js injects #backdrop + #sidebar here -->

  <main class="min-w-0 flex-1 overflow-y-auto px-5 py-4 lg:px-7">

    <!-- header -->
    <div class="mb-4 flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3">
        <button id="btn-menu" class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-surface text-muted hover:text-ink lg:hidden" title="Open menu"><i class="hgi-stroke hgi-menu-01 text-[18px]"></i></button>
        <div class="min-w-0">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-muted">Settings</p>
          <h1 class="text-[22px] font-bold tracking-tight">Organization</h1>
          <p class="mt-0.5 hidden truncate text-[12px] text-muted sm:block">Your company profile and branding.</p>
        </div>
      </div>
      <div class="ml-auto flex shrink-0 items-center gap-2.5"><button type="button" class="relative grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-surface text-muted transition hover:text-ink" title="Notifications"><i class="hgi-stroke hgi-notification-03 text-[18px]"></i><span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-red-500 ring-2 ring-surface"></span></button><div class="flex shrink-0 items-center gap-2.5"><div class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-brand to-emerald-400 text-[12px] font-semibold text-white">HN</div><div class="hidden leading-tight sm:block"><p class="text-[13px] font-semibold text-ink">Harper Nelson</p><p class="text-[11px] text-muted">Event Manager</p></div></div></div>
    </div>

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-[280px_minmax(0,1fr)]">

      <!-- logo card -->
      <div class="card p-5">
        <p class="text-[13px] font-bold tracking-tight">Organization logo</p>
        <div class="mt-3 flex items-center gap-4">
          <span class="grid h-20 w-20 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-brand to-emerald-400 text-[28px] font-bold text-white">E</span>
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" class="btn btn-soft btn-sm"><i class="hgi-stroke hgi-image-upload-01 text-[15px]"></i>Upload</button>
              <button type="button" class="text-[12px] font-medium text-muted transition hover:text-red-500">Remove</button>
            </div>
            <p class="mt-2 text-[11px] leading-snug text-muted">SVG, PNG or JPG · Max 1MB</p>
          </div>
        </div>
        <div class="mt-4 border-t border-hair pt-4">
          <h3 class="text-[15px] font-bold tracking-tight">Eventa Co., Ltd.</h3>
          <p class="text-[12px] text-muted">Bangkok, Thailand</p>
        </div>
        <div class="mt-4 space-y-2 border-t border-hair pt-4 text-[12px]">
          <p class="flex items-center justify-between"><span class="text-muted">Plan</span><span class="badge badge-green">Pro</span></p>
          <p class="flex items-center justify-between"><span class="text-muted">Events hosted</span><span class="font-semibold tabular-nums">128</span></p>
          <p class="flex items-center justify-between"><span class="text-muted">Team members</span><span class="font-semibold tabular-nums">8</span></p>
        </div>
      </div>

      <!-- details form -->
      <div class="card p-5">
        <h3 class="text-[14px] font-bold tracking-tight">Organization details</h3>
        <p class="mt-0.5 text-[12px] text-muted">Legal business info used on invoices and receipts.</p>

        <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="label">Organization name</label>
            <input class="input" value="Eventa Co., Ltd." />
          </div>
          <div>
            <label class="label">Website</label>
            <input class="input" type="url" value="https://eventa.io" />
          </div>
          <div class="sm:col-span-2">
            <label class="label">Address</label>
            <textarea class="textarea" rows="3">88 Sukhumvit Rd, Klongtoey, Bangkok 10110, Thailand</textarea>
          </div>
          <div>
            <label class="label">Currency</label>
            <select class="select">
              <option selected>Thai Baht (฿)</option>
              <option>US Dollar ($)</option>
              <option>Euro (€)</option>
              <option>Singapore Dollar (S$)</option>
            </select>
          </div>
          <div>
            <label class="label">Tax ID</label>
            <input class="input" value="0-1055-61234-56-7" />
          </div>
        </div>

        <div class="mt-5 flex justify-end gap-2 border-t border-hair pt-4">
          <button type="button" class="btn btn-soft btn-sm">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm"><i class="hgi-stroke hgi-tick-02 text-[15px]"></i>Save changes</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="../assets/shell.js?v=68"></script>
<script src="../assets/settings-ui.js?v=68"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventa · Check-in</title>
<script>try{var t=localStorage.getItem('eventa-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script src="../assets/config.js?v=33"></script>
<link rel="stylesheet" href="../assets/app.css?v=33" />
</head>
<body class="h-full bg-canvas font-sans text-ink antialiased" data-page="checkin">

<div class="flex h-full min-h-screen" data-layout>
  <!-- shell.js injects #backdrop + #sidebar here -->

  <main class="min-w-0 flex-1 overflow-y-auto px-5 py-4 lg:px-7">

    <!-- header -->
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3">
        <button id="btn-menu" class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-surface text-muted hover:text-ink lg:hidden" title="Open menu"><i class="hgi-stroke hgi-menu-01 text-[18px]"></i></button>
        <div class="min-w-0">
          <h1 class="text-[22px] font-bold tracking-tight">Check-in</h1>
          <p class="mt-0.5 hidden truncate text-[12px] text-muted sm:block">The attendance record for your event.</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="relative w-40 sm:w-52">
          <i class="hgi-stroke hgi-calendar-03 text-[15px] pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
          <select class="select h-10 w-full border-0 bg-surface pl-9 font-medium" id="event-select">
            <option>Tech Summit 2026</option>
            <option>Bangkok Jazz Night</option>
            <option>Sunrise Yoga Retreat</option>
            <option>Thai Street Food Festival</option>
            <option>UX Bangkok Meetup</option>
          </select>
        </div>
        <a href="check-in-tool.html" class="btn btn-primary shrink-0"><i class="hgi-stroke hgi-qr-code-01 text-[16px]"></i><span class="hidden sm:inline">Open check-in tool</span><span class="sm:hidden">Tool</span></a>
        <button type="button" class="relative grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-surface text-muted transition hover:text-ink" title="Notifications"><i class="hgi-stroke hgi-notification-03 text-[18px]"></i><span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-red-500 ring-2 ring-surface"></span></button>
        <div class="flex shrink-0 items-center gap-2.5"><div class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-brand to-emerald-400 text-[12px] font-semibold text-white">HN</div><div class="hidden leading-tight sm:block"><p class="text-[13px] font-semibold text-ink">Harper Nelson</p><p class="text-[11px] text-muted">Event Manager</p></div></div>
      </div>
    </div>

    <!-- progress strip -->
    <div class="card p-4">
      <div class="flex items-baseline justify-between gap-2">
        <p class="text-[13px] text-muted"><span id="p-checked" class="text-[17px] font-bold text-ink tnum">0</span> / <span id="p-total" class="tnum">0</span> attendees checked in</p>
        <p id="p-rate" class="text-[13px] font-bold text-brand tnum">0%</p>
      </div>
      <div class="mt-2 h-2 w-full rounded-full bg-line"><div id="p-bar" class="h-2 rounded-full bg-brand transition-all" style="width:0%"></div></div>
    </div>

    <!-- pill tabs (status) -->
    <div class="mt-4 flex w-fit max-w-full items-center gap-1 overflow-x-auto rounded-xl bg-surface p-1">
      <button class="pilltab tab-active" data-filter="all">All <span class="pilltab-count tnum" id="c-all">0</span></button>
      <button class="pilltab" data-filter="in">Checked in <span class="pilltab-count tnum" id="c-in">0</span></button>
      <button class="pilltab" data-filter="notyet">Not yet <span class="pilltab-count tnum" id="c-notyet">0</span></button>
    </div>

    <!-- search + filter -->
    <div class="mt-3 flex flex-col gap-2 sm:flex-row sm:items-center">
      <div class="relative w-full flex-1">
        <i class="hgi-stroke hgi-search-01 text-[16px] pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
        <input id="list-search" type="text" class="h-10 w-full rounded-lg bg-surface pl-9 pr-3 text-[13px] text-ink placeholder:text-muted focus:outline-none focus:ring-4 focus:ring-brand/15" placeholder="Search attendee, email or ticket…" />
      </div>
      <div class="relative w-full sm:w-48">
        <i class="hgi-stroke hgi-ticket-01 text-[15px] pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
        <select id="ticket-filter" class="select h-10 w-full border-0 bg-surface pl-9 font-medium">
          <option value="">All ticket types</option>
          <option>VIP</option>
          <option>General Admission</option>
          <option>Early Bird</option>
          <option>Student</option>
        </select>
      </div>
    </div>

    <!-- table -->
    <section class="card mt-3 p-4">
      <div class="overflow-x-auto">
        <table class="data-table min-w-[760px]">
          <thead>
            <tr><th>Attendee</th><th>Ticket</th><th>Checked in</th><th>Status</th><th class="text-right">Actions</th></tr>
          </thead>
          <tbody id="checkin-rows" class="text-[13px]"></tbody>
        </table>
      </div>
      <p id="list-empty" class="hidden py-10 text-center text-[13px] text-muted">No attendees match your filters.</p>
    </section>

    <p class="mt-4 text-center text-[11px] text-muted/70">Eventa · Event registration system · HTML, Tailwind CSS &amp; Hugeicons</p>
  </main>
</div>

<script src="../assets/shell.js?v=33"></script>
<script>
  (function () {
    var TONE = {
      brand:  'bg-brand-soft text-brand-dark dark:text-brand',
      blue:   'bg-blue-100 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300',
      pink:   'bg-pink-100 text-pink-700 dark:bg-pink-500/15 dark:text-pink-300',
      amber:  'bg-amber-100 text-amber-700 dark:bg-amber-400/15 dark:text-amber-300',
      violet: 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300',
      gray:   'bg-gray-100 text-gray-500 dark:bg-white/10 dark:text-gray-300'
    };
    var attendees = [
      { name:'Anong Pattana',     email:'anong.p@email.com',    ini:'AP', tone:'brand',  ticket:'VIP',               in:true,  time:'09:08' },
      { name:'Somchai Thongchai', email:'somchai.t@email.com',  ini:'ST', tone:'blue',   ticket:'General Admission', in:true,  time:'09:12' },
      { name:'Ploy Srisai',       email:'ploy.s@email.com',     ini:'PS', tone:'pink',   ticket:'Early Bird',        in:true,  time:'09:15' },
      { name:'James Wong',        email:'james.w@email.com',    ini:'JW', tone:'amber',  ticket:'General Admission', in:true,  time:'09:21' },
      { name:'Mei Lin',           email:'mei.l@email.com',      ini:'ML', tone:'violet', ticket:'Early Bird',        in:true,  time:'09:34' },
      { name:'Nattapong K.',      email:'nattapong.k@email.com',ini:'NK', tone:'brand',  ticket:'General Admission', in:true,  time:'09:47' },
      { name:'David Chen',        email:'david.c@email.com',    ini:'DC', tone:'blue',   ticket:'VIP',               in:true,  time:'10:02' },
      { name:'Kanya R.',          email:'kanya.r@email.com',    ini:'KR', tone:'gray',   ticket:'Student',           in:false, time:'' },
      { name:'Wipada Srisuk',     email:'wipada.s@email.com',   ini:'WS', tone:'pink',   ticket:'Early Bird',        in:false, time:'' },
      { name:'Raj Patel',         email:'raj.p@email.com',      ini:'RP', tone:'amber',  ticket:'General Admission', in:false, time:'' },
      { name:'Grace Bennett',     email:'grace.b@email.com',    ini:'GB', tone:'violet', ticket:'Student',           in:false, time:'' },
      { name:'Oliver Scott',      email:'oliver.s@email.com',   ini:'OS', tone:'brand',  ticket:'VIP',               in:false, time:'' }
    ];

    var tbody = document.getElementById('checkin-rows');
    var emptyEl = document.getElementById('list-empty');
    var search = document.getElementById('list-search');
    var ticketFilter = document.getElementById('ticket-filter');
    var filter = 'all';

    function nowTime() {
      var d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function counts() {
      var inN = attendees.filter(function (a) { return a.in; }).length;
      return { all: attendees.length, in: inN, notyet: attendees.length - inN };
    }

    function render() {
      var c = counts();
      document.getElementById('c-all').textContent = c.all;
      document.getElementById('c-in').textContent = c.in;
      document.getElementById('c-notyet').textContent = c.notyet;
      // progress strip
      var pct = c.all ? Math.round(c.in / c.all * 100) : 0;
      document.getElementById('p-checked').textContent = c.in;
      document.getElementById('p-total').textContent = c.all;
      document.getElementById('p-rate').textContent = pct + '%';
      document.getElementById('p-bar').style.width = pct + '%';

      var q = (search.value || '').trim().toLowerCase();
      var tk = ticketFilter.value;
      var rows = attendees.filter(function (a) {
        if (filter === 'in' && !a.in) return false;
        if (filter === 'notyet' && a.in) return false;
        if (tk && a.ticket !== tk) return false;
        if (q && (a.name + ' ' + a.email + ' ' + a.ticket).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });

      emptyEl.classList.toggle('hidden', rows.length > 0);
      tbody.innerHTML = rows.map(function (a) {
        var i = attendees.indexOf(a);
        var status = a.in
          ? '<span class="badge badge-green"><i class="hgi-stroke hgi-tick-02 text-[12px]"></i>Checked in</span>'
          : '<span class="badge badge-gray">Not checked in</span>';
        var action = a.in
          ? '<button class="btn btn-soft btn-sm" data-undo="' + i + '"><i class="hgi-stroke hgi-arrow-turn-backward text-[14px]"></i>Undo</button>'
          : '<button class="btn btn-primary btn-sm" data-in="' + i + '"><i class="hgi-stroke hgi-tick-02 text-[14px]"></i>Check in</button>';
        return '<tr>' +
          '<td><div class="flex items-center gap-2.5"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-[11px] font-semibold ' + TONE[a.tone] + '">' + a.ini + '</span><div class="min-w-0"><p class="truncate font-medium text-ink">' + a.name + '</p><p class="truncate text-[11px] text-muted">' + a.email + '</p></div></div></td>' +
          '<td><span class="rounded-full bg-canvas px-2.5 py-1 text-[11px] font-medium text-muted">' + a.ticket + '</span></td>' +
          '<td class="text-muted tnum">' + (a.time || '—') + '</td>' +
          '<td>' + status + '</td>' +
          '<td class="text-right">' + action + '</td>' +
          '</tr>';
      }).join('');
    }

    // pill tabs (status filter)
    document.querySelectorAll('[data-filter]').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('[data-filter]').forEach(function (x) { x.classList.toggle('tab-active', x === b); });
        filter = b.dataset.filter;
        render();
      });
    });
    search.addEventListener('input', render);
    ticketFilter.addEventListener('change', render);

    // check in / undo
    tbody.addEventListener('click', function (e) {
      var inBtn = e.target.closest('[data-in]');
      var undoBtn = e.target.closest('[data-undo]');
      if (inBtn) { var a = attendees[+inBtn.dataset.in]; a.in = true; a.time = nowTime(); render(); }
      else if (undoBtn) { var b = attendees[+undoBtn.dataset.undo]; b.in = false; b.time = ''; render(); }
    });

    render();
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventa · Delivery log</title>
<script>try{var t=localStorage.getItem('eventa-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script src="../assets/config.js?v=64"></script>
<link rel="stylesheet" href="../assets/app.css?v=64" />
</head>
<body class="h-full bg-canvas font-sans text-ink antialiased" data-page="messaging-log">

<div class="flex h-full min-h-screen" data-layout>
  <!-- shell.js injects #backdrop + #sidebar here -->

  <main class="min-w-0 flex-1 overflow-y-auto px-5 py-4 lg:px-7">

    <!-- header -->
    <div class="mb-4 flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3">
        <button id="btn-menu" class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-surface text-muted hover:text-ink lg:hidden" title="Open menu"><i class="hgi-stroke hgi-menu-01 text-[18px]"></i></button>
        <div class="min-w-0">
          <h1 class="text-[22px] font-bold tracking-tight">Delivery log</h1>
          <p class="mt-0.5 hidden truncate text-[12px] text-muted sm:block">Every individual email &amp; SMS delivery, with its status.</p>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-2.5"><button type="button" class="btn btn-ghost shrink-0"><i class="hgi-stroke hgi-download-04 text-[16px]"></i><span class="hidden sm:inline">Export</span></button><button type="button" class="relative grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-surface text-muted transition hover:text-ink" title="Notifications"><i class="hgi-stroke hgi-notification-03 text-[18px]"></i><span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-red-500 ring-2 ring-surface"></span></button><div class="flex shrink-0 items-center gap-2.5"><div class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-brand to-emerald-400 text-[12px] font-semibold text-white">HN</div><div class="hidden leading-tight sm:block"><p class="text-[13px] font-semibold text-ink">Harper Nelson</p><p class="text-[11px] text-muted">Event Manager</p></div></div></div>
    </div>

    <!-- ============ DELIVERY LOG ============ -->
    <section class="card p-4">
      <div class="flex items-center justify-between">
        <h2 class="text-[15px] font-bold tracking-tight">Delivery log</h2>
        <p class="text-[12px] text-muted">Delivery history</p>
      </div>
      <div class="mt-2 overflow-x-auto">
        <table class="data-table min-w-[820px]">
          <thead>
            <tr><th>Recipient</th><th>Type</th><th>Channel</th><th>Status</th><th class="text-right">Time</th></tr>
          </thead>
          <tbody id="notif-rows" class="text-[13px]"></tbody>
        </table>
      </div>

      <div id="notif-pager" class="mt-3 flex flex-wrap items-center justify-between gap-3 text-[12px] text-muted">
        <p id="notif-showing"></p>
        <div class="flex items-center gap-3">
          <label class="flex items-center gap-2 whitespace-nowrap">Rows per page
            <select id="notif-size" class="select h-8 w-auto min-w-[3.75rem] py-0 pl-2.5 pr-7 text-[12px] font-medium text-ink">
              <option>10</option><option>20</option><option>30</option><option>50</option>
            </select>
          </label>
          <div class="flex gap-1">
            <button id="notif-prev" class="btn btn-soft btn-sm" type="button" aria-label="Previous page" disabled><i class="hgi-stroke hgi-arrow-left-01 text-[14px]"></i><span class="hidden sm:inline">Prev</span></button>
            <button id="notif-next" class="btn btn-soft btn-sm" type="button" aria-label="Next page"><span class="hidden sm:inline">Next</span><i class="hgi-stroke hgi-arrow-right-01 text-[14px]"></i></button>
          </div>
        </div>
      </div>
    </section>

    <p class="mt-4 text-center text-[11px] text-muted/70">Eventa · Event registration system · HTML, Tailwind CSS &amp; Hugeicons</p>
  </main>
</div>

<script src="../assets/shell.js?v=64"></script>
<script>
(function () {
  var nf = function (n) { return n.toLocaleString('en-US'); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var CHAN = {
    email: ['badge-blue', 'hgi-mail-01', 'Email'],
    sms: ['badge-green', 'hgi-smart-phone-01', 'SMS']
  };
  var STAT = {
    delivered: ['badge-green', 'hgi-tick-02', 'Delivered'],
    opened: ['badge-purple', 'hgi-eye', 'Opened'],
    sent: ['badge-blue', 'hgi-mail-send-01', 'Sent'],
    failed: ['badge-red', 'hgi-alert-circle', 'Failed']
  };
  function badge(map, key) { var m = map[key]; return '<span class="badge ' + m[0] + '"><i class="hgi-stroke ' + m[1] + ' text-[12px]"></i>' + m[2] + '</span>'; }

  /* ---------- DATA: 10 seeded rows (verbatim) + 14 more = 24 deliveries ---------- */
  var DATA = [
    { initials: 'AP', name: 'Anong P.', email: 'anong.p@gmail.com', type: 'Registration confirmation', channel: 'email', status: 'delivered', time: 'Jul 9 · 10:24' },
    { initials: 'ST', name: 'Somchai T.', email: 'somchai.t@hotmail.com', type: 'Payment receipt', channel: 'email', status: 'opened', time: 'Jul 9 · 10:03' },
    { initials: 'PS', name: 'Ploy S.', email: 'ploy.s@gmail.com', type: 'Event reminder (24h)', channel: 'sms', status: 'sent', time: 'Jul 9 · 09:47' },
    { initials: 'JW', name: 'James W.', email: 'james.wilson@gmail.com', type: 'Cancellation notice', channel: 'email', status: 'delivered', time: 'Jul 8 · 18:12' },
    { initials: 'ML', name: 'Mei L.', email: 'mei.lin@outlook.com', type: 'Waitlist offer', channel: 'email', status: 'opened', time: 'Jul 8 · 16:30' },
    { initials: 'NK', name: 'Nutcha K.', email: 'nutcha.k@gmail.com', type: 'Venue change notice', channel: 'sms', status: 'failed', time: 'Jul 8 · 14:05' },
    { initials: 'DC', name: 'David C.', email: 'david.chen@gmail.com', type: 'Registration confirmation', channel: 'email', status: 'delivered', time: 'Jul 8 · 11:22' },
    { initials: 'KR', name: 'Kanya R.', email: 'kanya.r@yahoo.com', type: 'Post-event thank-you', channel: 'email', status: 'sent', time: 'Jul 7 · 20:15' },
    { initials: 'AB', name: 'Arthit B.', email: 'arthit.b@gmail.com', type: 'Payment receipt', channel: 'email', status: 'delivered', time: 'Jul 7 · 15:48' },
    { initials: 'SM', name: 'Sofia M.', email: 'sofia.m@gmail.com', type: 'Event reminder (24h)', channel: 'sms', status: 'delivered', time: 'Jul 7 · 09:10' },
    { initials: 'WC', name: 'Wichai C.', email: 'wichai.c@gmail.com', type: 'Registration confirmation', channel: 'email', status: 'delivered', time: 'Jul 6 · 22:40' },
    { initials: 'GH', name: 'Grace H.', email: 'grace.harris@outlook.com', type: 'Waitlist offer', channel: 'email', status: 'opened', time: 'Jul 6 · 19:05' },
    { initials: 'NP', name: 'Nattapong P.', email: 'nattapong.p@gmail.com', type: 'Event reminder (24h)', channel: 'sms', status: 'delivered', time: 'Jul 6 · 17:33' },
    { initials: 'RK', name: 'Ravi K.', email: 'ravi.kumar@gmail.com', type: 'Payment receipt', channel: 'email', status: 'sent', time: 'Jul 6 · 12:18' },
    { initials: 'SB', name: 'Suda B.', email: 'suda.b@yahoo.com', type: 'Cancellation notice', channel: 'email', status: 'failed', time: 'Jul 5 · 21:50' },
    { initials: 'EM', name: 'Emma M.', email: 'emma.davies@gmail.com', type: 'Registration confirmation', channel: 'email', status: 'delivered', time: 'Jul 5 · 16:42' },
    { initials: 'KP', name: 'Kittisak P.', email: 'kittisak.p@hotmail.com', type: 'Post-event thank-you', channel: 'email', status: 'opened', time: 'Jul 5 · 14:09' },
    { initials: 'YN', name: 'Yuki N.', email: 'yuki.nakamura@outlook.com', type: 'Event reminder (24h)', channel: 'sms', status: 'delivered', time: 'Jul 5 · 08:55' },
    { initials: 'PC', name: 'Preeya C.', email: 'preeya.c@gmail.com', type: 'Venue change notice', channel: 'sms', status: 'sent', time: 'Jul 4 · 20:21' },
    { initials: 'OK', name: 'Omar K.', email: 'omar.k@gmail.com', type: 'Payment receipt', channel: 'email', status: 'delivered', time: 'Jul 4 · 15:37' },
    { initials: 'SW', name: 'Siriporn W.', email: 'siriporn.w@yahoo.com', type: 'Waitlist offer', channel: 'email', status: 'delivered', time: 'Jul 4 · 11:14' },
    { initials: 'LS', name: 'Lucas S.', email: 'lucas.silva@gmail.com', type: 'Registration confirmation', channel: 'email', status: 'opened', time: 'Jul 3 · 19:48' },
    { initials: 'MK', name: 'Malee K.', email: 'malee.k@gmail.com', type: 'Cancellation notice', channel: 'email', status: 'delivered', time: 'Jul 3 · 13:26' },
    { initials: 'DK', name: 'Daniel K.', email: 'daniel.kim@outlook.com', type: 'Event reminder (24h)', channel: 'sms', status: 'failed', time: 'Jul 3 · 09:02' }
  ];

  function rowHTML(r) {
    return '<tr>' +
      '<td><div class="flex items-center gap-2"><span class="avatar h-8 w-8 text-[11px]">' + esc(r.initials) + '</span><div class="min-w-0 leading-tight"><p class="font-medium text-ink">' + esc(r.name) + '</p><p class="text-[11px] text-muted">' + esc(r.email) + '</p></div></div></td>' +
      '<td class="text-muted">' + esc(r.type) + '</td>' +
      '<td>' + badge(CHAN, r.channel) + '</td>' +
      '<td>' + badge(STAT, r.status) + '</td>' +
      '<td class="text-right text-muted tnum">' + esc(r.time) + '</td>' +
    '</tr>';
  }

  var tbody = document.getElementById('notif-rows');
  var elShowing = document.getElementById('notif-showing');
  var elPrev = document.getElementById('notif-prev');
  var elNext = document.getElementById('notif-next');
  var state = { page: 0, size: 10 };

  function render() {
    var list = DATA, total = list.length, pages = Math.max(1, Math.ceil(total / state.size));
    if (state.page >= pages) state.page = pages - 1;
    if (state.page < 0) state.page = 0;
    var start = state.page * state.size, slice = list.slice(start, start + state.size);
    tbody.innerHTML = slice.map(rowHTML).join('');
    if (total === 0) { elShowing.textContent = 'No deliveries'; }
    else { elShowing.innerHTML = 'Showing <span class="font-semibold text-ink">' + (start + 1) + '–' + (start + slice.length) + '</span> of <span class="font-semibold text-ink tnum">' + nf(total) + '</span> deliveries'; }
    elPrev.disabled = total === 0 || state.page === 0;
    elNext.disabled = total === 0 || state.page >= pages - 1;
  }

  document.getElementById('notif-size').addEventListener('change', function () { state.size = +this.value; state.page = 0; render(); });
  elPrev.addEventListener('click', function () { if (state.page > 0) { state.page--; render(); } });
  elNext.addEventListener('click', function () { state.page++; render(); });

  render();
})();
</script>
</body>
</html>

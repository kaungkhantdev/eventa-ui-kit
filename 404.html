<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventa · Page not found</title>
<script>try{var t=localStorage.getItem('eventa-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/config.js?v=70"></script>
<link rel="stylesheet" href="assets/app.css?v=70" />
</head>
<body class="h-full bg-canvas font-sans text-ink antialiased">

<button id="theme-btn" class="btn-icon fixed right-4 top-4 z-10 bg-surface" title="Toggle theme"><i class="hgi-stroke hgi-moon-02 text-[18px]"></i></button>

<main class="grid min-h-screen place-items-center px-6 py-12">
  <div class="w-full max-w-lg text-center">

    <!-- logo -->
    <a href="admin/home.html" class="inline-flex items-center gap-2" title="Eventa home">
      <span class="brand-logo text-brand h-[20px] w-[37px]"></span>
      <span class="text-[17px] font-extrabold tracking-tight text-ink">Eventa</span>
    </a>

    <!-- visual -->
    <div class="mt-10 flex justify-center">
      <span class="grid h-20 w-20 place-items-center rounded-2xl bg-brand-soft text-brand">
        <i class="hgi-stroke hgi-compass-01 text-[40px]"></i>
      </span>
    </div>

    <p class="mt-6 text-[12px] font-semibold uppercase tracking-[0.2em] text-brand">Error 404</p>
    <h1 class="mt-2 text-[28px] font-extrabold tracking-tight text-ink sm:text-[32px]">Page not found</h1>
    <p class="mx-auto mt-2.5 max-w-sm text-[14px] leading-relaxed text-muted">
      The page you're looking for doesn't exist, was moved, or might still be under construction.
    </p>

    <div class="mt-7 flex flex-col items-center justify-center gap-2.5 sm:flex-row">
      <a href="admin/home.html" class="btn btn-primary w-full sm:w-auto"><i class="hgi-stroke hgi-home-01 text-[16px]"></i>Back to home</a>
      <button type="button" onclick="if(history.length>1){history.back()}else{location.href='admin/home.html'}" class="btn btn-soft w-full sm:w-auto"><i class="hgi-stroke hgi-arrow-left-01 text-[16px]"></i>Go back</button>
    </div>

    <p class="mt-8 text-[12px] text-muted">
      Still stuck? <a href="admin/settings-profile.html" class="font-semibold text-brand hover:underline">Contact support</a>
    </p>

  </div>
</main>

<script>
  (function () {
    var b = document.getElementById('theme-btn');
    function set(d) {
      document.documentElement.classList.toggle('dark', d);
      try { localStorage.setItem('eventa-theme', d ? 'dark' : 'light'); } catch (e) {}
      b.querySelector('i').className = 'hgi-stroke ' + (d ? 'hgi-sun-03' : 'hgi-moon-02') + ' text-[18px]';
    }
    set(document.documentElement.classList.contains('dark'));
    b.addEventListener('click', function () { set(!document.documentElement.classList.contains('dark')); });
  })();
</script>
</body>
</html>

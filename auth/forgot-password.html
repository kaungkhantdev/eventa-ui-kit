<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventa · Reset password</title>
<script>try{var t=localStorage.getItem('eventa-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/config.js?v=8"></script>
<link rel="stylesheet" href="../assets/app.css?v=8" />
</head>
<body class="h-full bg-canvas font-sans text-ink antialiased">

  <button id="theme-btn" class="btn-icon fixed right-4 top-4 z-10 bg-surface"><i class="hgi-stroke hgi-moon-02 text-[18px]"></i></button>

  <div class="grid min-h-full place-items-center px-4 py-14 sm:py-20">
    <div class="w-full max-w-sm">

      <!-- logo + heading -->
      <div class="mb-7 flex flex-col items-center gap-4 text-center">
        <a href="../index.html" class="flex items-center gap-2">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand text-white"><i class="hgi-stroke hgi-ticket-star text-[20px]"></i></span>
          <span class="text-[18px] font-extrabold text-brand-dark">Eventa</span>
        </a>
        <div>
          <h1 class="text-[22px] font-bold tracking-tight">Reset your password</h1>
          <p class="mt-1 text-[13px] text-muted">Enter your email and we'll send a reset link.</p>
        </div>
      </div>

      <!-- card -->
      <div class="card p-6">
        <form id="reset-form" class="space-y-4">
          <div>
            <label for="email" class="label">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" class="input" required />
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary w-full">
            <i class="hgi-stroke hgi-mail-send-01 text-[16px]"></i>
            <span>Send reset link</span>
          </button>

          <div id="success-hint" class="hidden items-start gap-2 rounded-lg bg-brand-soft px-3 py-2.5 text-[12px] text-brand-dark">
            <i class="hgi-stroke hgi-checkmark-circle-02 mt-0.5 shrink-0 text-[15px]"></i>
            <span>Check your inbox — if an account matches <strong id="sent-email">that email</strong>, a reset link is on its way.</span>
          </div>
        </form>
      </div>

      <p class="mt-6 text-center text-[13px]">
        <a href="login.html" class="inline-flex items-center gap-1 font-semibold text-brand hover:underline">
          <i class="hgi-stroke hgi-arrow-left-01 text-[14px]"></i>
          Back to sign in
        </a>
      </p>
    </div>
  </div>

  <script>
    (function(){var b=document.getElementById('theme-btn');function set(d){document.documentElement.classList.toggle('dark',d);try{localStorage.setItem('eventa-theme',d?'dark':'light')}catch(e){}b.querySelector('i').className='hgi-stroke '+(d?'hgi-sun-03':'hgi-moon-02')+' text-[18px]';}set(document.documentElement.classList.contains('dark'));b.addEventListener('click',function(){set(!document.documentElement.classList.contains('dark'));});})();

    (function(){
      var form = document.getElementById('reset-form');
      var email = document.getElementById('email');
      var btn = document.getElementById('submit-btn');
      var hint = document.getElementById('success-hint');
      var sentEmail = document.getElementById('sent-email');

      form.addEventListener('submit', function(e){
        e.preventDefault();
        sentEmail.textContent = email.value || 'that email';
        hint.classList.remove('hidden');
        hint.classList.add('flex');
        btn.disabled = true;
        btn.classList.add('opacity-60', 'cursor-not-allowed');
        btn.querySelector('span').textContent = 'Link sent';
        btn.querySelector('i').className = 'hgi-stroke hgi-checkmark-circle-02 text-[16px]';
      });
    })();
  </script>
</body>
</html>

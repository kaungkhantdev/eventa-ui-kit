<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventa · Sign in</title>
<script>try{var t=localStorage.getItem('eventa-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/config.js?v=36"></script>
<link rel="stylesheet" href="../assets/app.css?v=36" />
</head>
<body class="h-full bg-canvas font-sans text-ink antialiased">

  <button id="theme-btn" class="btn-icon fixed right-4 top-4 z-10 bg-surface"><i class="hgi-stroke hgi-moon-02 text-[18px]"></i></button>

  <div class="grid min-h-full place-items-center px-4 py-14 sm:py-20">
    <div class="w-full max-w-sm">

      <!-- logo + heading -->
      <div class="mb-7 flex flex-col items-center gap-4 text-center">
        <a href="../index.html" class="flex items-center gap-2">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand text-white"><i class="hgi-stroke hgi-fire text-[20px]"></i></span>
          <span class="text-[18px] font-extrabold text-brand-dark">Eventa</span>
        </a>
        <div>
          <h1 class="text-[22px] font-bold tracking-tight">Welcome back</h1>
          <p class="mt-1 text-[13px] text-muted">Sign in to manage your events and registrations.</p>
        </div>
      </div>

      <!-- card -->
      <div class="card p-6">
        <form id="login-form" class="space-y-4">
          <div>
            <label for="email" class="label">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" class="input" required />
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label for="password" class="label mb-0">Password</label>
            </div>
            <div class="relative mt-1.5">
              <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" class="input pr-10" required />
              <button type="button" id="toggle-pw" class="btn-icon absolute right-1 top-1/2 -translate-y-1/2" title="Show password">
                <i class="hgi-stroke hgi-view text-[16px]"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <label class="flex cursor-pointer items-center gap-2 text-[13px] text-muted">
              <input type="checkbox" class="h-3.5 w-3.5 rounded border-hair accent-brand" />
              Remember me
            </label>
            <a href="forgot-password.html" class="text-[13px] font-semibold text-brand hover:underline">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-full">Sign in</button>
        </form>

        <div class="my-5 flex items-center gap-3">
          <div class="h-px flex-1 bg-hair"></div>
          <span class="text-[11px] font-medium uppercase tracking-wide text-muted">or</span>
          <div class="h-px flex-1 bg-hair"></div>
        </div>

        <div class="space-y-2.5">
          <button type="button" class="btn btn-soft w-full">
            <i class="hgi-stroke hgi-global text-[16px]"></i>
            Continue with Google
          </button>
          <button type="button" class="btn btn-soft w-full">
            <i class="hgi-stroke hgi-global text-[16px]"></i>
            Continue with LinkedIn
          </button>
        </div>
      </div>

      <p class="mt-6 text-center text-[13px] text-muted">Don't have an account? <a href="register.html" class="font-semibold text-brand hover:underline">Create one</a></p>
    </div>
  </div>

  <script>
    (function(){var b=document.getElementById('theme-btn');function set(d){document.documentElement.classList.toggle('dark',d);try{localStorage.setItem('eventa-theme',d?'dark':'light')}catch(e){}b.querySelector('i').className='hgi-stroke '+(d?'hgi-sun-03':'hgi-moon-02')+' text-[18px]';}set(document.documentElement.classList.contains('dark'));b.addEventListener('click',function(){set(!document.documentElement.classList.contains('dark'));});})();

    (function(){
      var pw = document.getElementById('password'), btn = document.getElementById('toggle-pw');
      btn.addEventListener('click', function(){
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        btn.querySelector('i').className = 'hgi-stroke ' + (show ? 'hgi-view-off-slash' : 'hgi-view') + ' text-[16px]';
        btn.title = show ? 'Hide password' : 'Show password';
      });
    })();

    document.getElementById('login-form').addEventListener('submit', function(e){ e.preventDefault(); });
  </script>
</body>
</html>
